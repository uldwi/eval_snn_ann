dataset:
  name: mnist
evaluation:
  num_test_samples: 500
joulescope:
  max_duration: 6000.0
  timeout: 6000.0
microcontroller:
  boards:
    esp32c6:
      architecture: RISC-V
      board: ESP32-C6-DevKitC-1
      cpu_freq_mhz: 160
      joulescope_gpi: in1
      name: ESP32-C6
      snn_optimization:
        SNN_PROFILE: 0
        SNN_SEL_CONV_ACC32: 0
        SNN_SEL_DENSE_REF: 0
        SNN_SEL_INT8: 0
        SNN_SEL_INT8_FC: 0
        SNN_SEL_LAYOUT_NHWC: 0
        SNN_SEL_LAZY_DECAY: 0
      sram_kb: 512
      trigger_gpio: 4
    esp32s3:
      architecture: Xtensa LX7
      board: ESP32-S3-DevKitC-1 v1.1
      cpu_freq_mhz: 240
      joulescope_gpi: in1
      name: ESP32-S3
      snn_optimization:
        SNN_PROFILE: 0
        SNN_SEL_CONV_ACC32: 0
        SNN_SEL_DENSE_REF: 0
        SNN_SEL_INT8: 0
        SNN_SEL_INT8_FC: 0
        SNN_SEL_LAYOUT_NHWC: 0
        SNN_SEL_LAZY_DECAY: 0
      sram_kb: 512
      trigger_gpio: 4
  target: esp32s3
models:
  - name: ANN_MNIST_Conv16_32_64
    activation: relu
    batch_size: 64
    conv_layers:
      - kernel_size: 3
        out_channels: 16
        padding: 1
        pool_size: 2
        stride: 1
      - kernel_size: 3
        out_channels: 32
        padding: 1
        pool_size: 2
        stride: 1
    dataset: mnist
    epochs: 0
    hidden_layers:
      - 64
    learning_rate: 0.001
    type: ann
  - name: SNN_MNIST_LIF_Conv16_32_64_TTFS
    batch_size: 64
    beta: 0.9
    conv_layers:
      - kernel_size: 3
        out_channels: 16
        padding: 1
        pool_size: 2
        stride: 1
      - kernel_size: 3
        out_channels: 32
        padding: 1
        pool_size: 2
        stride: 1
    dataset: mnist
    encoding_type: ttfs
    epochs: 0
    hidden_layers:
      - 64
    learning_rate: 0.005
    neuron_type: lif
    num_steps: 10
    threshold: 1.0
    type: snn
  - name: ANN_PhysioNet_EEGMI_EEGNetInspired_CSP_Temporal
    activation: relu
    batch_size: 64
    conv_layers:
      # EEGNet-inspired: temporal filters, followed by a spatial CSP-component mix.
      - kernel_size: [1, 31]
        out_channels: 8
        padding: [0, 15]
        pool_size: [1, 4]
        pool_stride: [1, 4]
        pool_type: avg
      - kernel_size: [8, 1]
        out_channels: 16
        padding: 0
        pool_size: [1, 2]
        pool_stride: [1, 2]
        pool_type: avg
      - kernel_size: [1, 9]
        out_channels: 16
        padding: [0, 4]
        pool_size: [1, 2]
        pool_stride: [1, 2]
        pool_type: avg
    dataset: physionet_eeg_mi_csp_temporal
    epochs: 60
    early_stopping:
      enabled: true
      monitor: val_acc
      patience: 10
      restore_best_weights: true
    hidden_layers:
      - 32
    learning_rate: 0.0005
    optimization:
      pruning:
        enabled: false
      quantization:
        enabled: false
    type: ann
  - name: SNN_PhysioNet_EEGMI_EEGNetInspired_CSP_Temporal_IF
    batch_size: 64
    beta: 1.0
    conv_layers:
      - kernel_size: [1, 31]
        out_channels: 8
        padding: [0, 15]
        pool_size: [1, 4]
        pool_stride: [1, 4]
        pool_type: avg
      - kernel_size: [8, 1]
        out_channels: 16
        padding: 0
        pool_size: [1, 2]
        pool_stride: [1, 2]
        pool_type: avg
      - kernel_size: [1, 9]
        out_channels: 16
        padding: [0, 4]
        pool_size: [1, 2]
        pool_stride: [1, 2]
        pool_type: avg
    dataset: physionet_eeg_mi_csp_temporal
    encoding_type: ttfs
    epochs: 60
    early_stopping:
      enabled: true
      monitor: val_acc
      patience: 10
      restore_best_weights: true
    hidden_layers:
      - 32
    learning_rate: 0.0005
    neuron_type: if
    num_steps: 10
    threshold: 1.0
    output_readout: analog
    ann_checkpoint: ANN_PhysioNet_EEGMI_EEGNetInspired_CSP_Temporal
    optimization:
      pruning:
        enabled: false
      quantization:
        enabled: false
    type: snn
  - name: ANN_FashionMNIST_Conv32_64_128
    activation: relu
    batch_size: 64
    conv_layers:
      - kernel_size: 3
        out_channels: 32
        padding: 1
        pool_size: 2
        stride: 1
      - kernel_size: 3
        out_channels: 64
        padding: 1
        pool_size: 2
        stride: 1
    dataset: fashion_mnist
    epochs: 6
    hidden_layers:
      - 128
    learning_rate: 0.005
    type: ann
  - name: SNN_FashionMNIST_LIF_Conv32_64_128_Direct
    batch_size: 64
    beta: 0.9
    conv_layers:
      - kernel_size: 3
        out_channels: 32
        padding: 1
        pool_size: 2
        stride: 1
      - kernel_size: 3
        out_channels: 64
        padding: 1
        pool_size: 2
        stride: 1
    dataset: fashion_mnist
    encoding_type: ttfs
    epochs: 10
    hidden_layers:
      - 128
    learning_rate: 0.005
    neuron_type: if
    num_steps: 10
    threshold: 1.0
    type: snn
  - name: ANN_CIFAR10_Conv32_64_128
    activation: relu
    batch_size: 64
    conv_layers:
      - kernel_size: 3
        out_channels: 32
        padding: 1
        pool_size: 2
        stride: 1
      - kernel_size: 3
        out_channels: 64
        padding: 1
        pool_size: 2
        stride: 1
    dataset: cifar10
    epochs: 8
    hidden_layers:
      - 128
    learning_rate: 0.005
    type: ann
  - name: SNN_CIFAR10_LIF_Conv32_64_128_TTFS_Reg
    batch_size: 64
    beta: 0.9
    conv_layers:
      - kernel_size: 3
        out_channels: 32
        padding: 1
        pool_size: 2
        stride: 1
      - kernel_size: 3
        out_channels: 64
        padding: 1
        pool_size: 2
        stride: 1
    dataset: cifar10
    dropout: 0.5
    early_stopping:
      enabled: true
      monitor: test_acc
      patience: 10
      restore_best_weights: true
    encoding_type: ttfs
    epochs: 80
    hidden_layers:
      - 128
    learning_rate: 0.001
    neuron_type: if
    num_steps: 20
    threshold: 1.0
    type: snn
  - name: ANN_KWS_SpeechCommandsV02_35Words_Conv16_32_64
    activation: relu
    batch_size: 64
    conv_layers:
      - kernel_size: 3
        out_channels: 16
        padding: 1
        pool_size: 2
        stride: 1
      - kernel_size: 3
        out_channels: 32
        padding: 1
        pool_size: 2
        stride: 1
    dataset: speech_commands
    epochs: 10
    hidden_layers:
      - 64
    learning_rate: 0.001
    type: ann
  - name: SNN_KWS_SpeechCommandsV02_35Words_IF_Conv16_32_64_TTFS
    batch_size: 64
    beta: 0.9
    conv_layers:
      - kernel_size: 3
        out_channels: 16
        padding: 1
        pool_size: 2
        stride: 1
      - kernel_size: 3
        out_channels: 32
        padding: 1
        pool_size: 2
        stride: 1
    dataset: speech_commands
    encoding_type: ttfs
    epochs: 40
    early_stopping:
      enabled: true
      monitor: test_acc
      patience: 8
      restore_best_weights: true
    hidden_layers:
      - 64
    learning_rate: 0.001
    neuron_type: if
    num_steps: 10
    threshold: 1.0
    ann_checkpoint: ANN_KWS_SpeechCommandsV02_35Words_Conv16_32_64
    type: snn
optimization:
  clustering:
    enabled: false
    num_clusters: 16
  pruning:
    amount: 0.3
    enabled: true
    fine_tune_epochs: 2
    fine_tune_lr: 0.0001
    layers:
      - conv
      - fc
    method: l1_unstructured
  quantization:
    enabled: true
    layers:
      - conv
      - fc
    mode: symmetric
    per_channel: true
    type: int8
training:
  auto_save: true
  batch_size: 64
  data_dir: ./data
  dataset: mnist
  early_stopping: false
  epochs: 5
  learning_rate: 0.001
  min_delta: 0.001
  monitor: test_acc
  optimizer: adam
  patience: 3
  random_seed: 42
  restore_best_weights: true
  save_dir: ./saved_models
